    <text x="66" y="319" fill="#f3f1eb" font-size="15" letter-spacing="3">8PLUS × MOKYUU</text>
    <text x="1134" y="319" text-anchor="end" fill="#c6d4ee" font-size="12" letter-spacing="2">BUILD WITH CURIOSITY</text>
