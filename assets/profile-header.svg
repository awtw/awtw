    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <g fill="none" stroke="#99baff" stroke-opacity=".3">
    <circle cx="1000" cy="180" r="115"/><circle cx="1000" cy="180" r="155"/><circle cx="1000" cy="180" r="195"/>
    <path d="M785 180h410M1000 0v360"/>
