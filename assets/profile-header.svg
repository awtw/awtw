    <text x="64" y="68" fill="#a8f0df" font-size="14" letter-spacing="4">INDEPENDENT DIGITAL IDENTITY</text>
    <text x="60" y="202" fill="#f3f1eb" font-size="118" font-weight="700" letter-spacing="-7">awtw<tspan fill="#ff6047">.</tspan></text>
